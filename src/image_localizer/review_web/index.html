<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>单图片翻译 · 审阅台</title><link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/desk.css"><script src="/desk.js" defer></script><script src="/dsh-bridge.js" defer></script></head>
<body>
<a class="skip" href="#workspace">跳到图片审阅</a>
<header class="masthead"><a class="brand" href="/" aria-label="审阅台首页"><span class="brand-mark" aria-hidden="true">译</span><span>单图片翻译 <small>审阅台</small></span></a><div class="header-actions"><span class="local-tag">本地工作区</span><button id="refresh" type="button">刷新</button></div></header>
<div class="shell">
<aside class="task-rail" aria-label="图片列表"><div class="rail-heading"><h2>图片</h2><span id="task-count">—</span></div><label for="search" class="sr-only">搜索图片、语言或版本</label><input id="search" type="search" placeholder="搜索图片、语言或版本" autocomplete="off"><label for="filter" class="sr-only">筛选图片</label><select id="filter"><option value="all">全部图片</option><option value="output">已有译图</option><option value="pending">待制作</option></select><nav id="task-list" aria-label="选择图片"><p class="muted">正在读取图片…</p></nav><details id="warnings" hidden><summary>有记录需要检查</summary><div></div></details><p class="rail-foot">同一原图的语言与版本收纳在一起。</p></aside>
<main id="workspace" tabindex="-1"><div id="notice" class="notice" role="status" aria-live="polite" hidden></div><section id="empty" class="empty"><h1>选择一张图片开始审阅</h1><p>在图片下切换语言与版本，集中检查本轮结果。</p></section>
<div id="task-content" hidden>
<header class="task-heading"><div><h1 id="task-title"></h1><p id="task-meta" class="muted"></p></div><span id="task-status" class="status"></span></header>
<div class="task-switcher"><label for="language-select">语言</label><select id="language-select"></select><label for="version-select">版本</label><select id="version-select"></select><span id="version-count" class="muted"></span></div>
<div class="review-layout"><div class="visual-column">
<section class="image-section" aria-label="图片对照"><div class="viewer-toolbar"><div class="segmented" aria-label="查看方式"><button data-mode="compare" aria-pressed="true">双图对照</button><button data-mode="wipe" aria-pressed="false">滑杆对照</button><button data-mode="output" aria-pressed="false">单图查看</button></div><div class="viewer-options"><label class="check"><input id="show-regions" type="checkbox" checked>区域</label><button id="actual-size" aria-pressed="false">原尺寸</button></div></div><div class="layer-bar"><label for="layer">图层</label><select id="layer"><option value="output">最终译图</option><option value="background">无字背景</option><option value="text">透明文字层</option><option value="source">原图</option></select><span id="image-hint" class="muted"></span></div><div id="image-viewer" class="image-viewer"><div id="image-stage"></div></div><div id="wipe-control" class="wipe-control" hidden><label for="wipe-range">原图 / 译图</label><input id="wipe-range" type="range" min="0" max="100" value="50"><output for="wipe-range">50%</output></div><div class="image-foot"><span id="image-size">图片载入中</span><a id="open-image" target="_blank" rel="noopener">打开图层 ↗</a></div></section>
<section class="regions-section"><div class="section-heading"><h2>逐区核对 <span id="region-count"></span></h2><div class="region-tools"><label for="region-filter" class="sr-only">筛选区域</label><select id="region-filter"><option value="all">全部区域</option><option value="pending">仅看待处理</option><option value="changes_requested">仅看需要修改</option></select><button id="approve-visible" type="button">本页全部认可</button></div></div><p id="region-batch-hint" class="form-hint" role="status">点击编号展开备注；区域标记保存后生效。</p><div class="region-table-wrap"><table class="region-table"><thead><tr><th scope="col">编号</th><th scope="col">原文</th><th scope="col">译文</th><th scope="col">结论</th></tr></thead><tbody id="regions"></tbody></table></div></section>
<details class="evidence"><summary>技术记录与版本指纹</summary><p id="task-path" class="eyebrow"></p><dl><dt>原图指纹</dt><dd id="source-hash"></dd><dt>译图指纹</dt><dd id="output-hash"></dd><dt id="manifest-label">译稿指纹</dt><dd id="manifest-hash"></dd></dl><div id="evidence-body"></div></details>
</div><aside class="review-column" aria-label="审阅意见"><section class="review-panel"><div class="panel-top"><span class="small-marker" aria-hidden="true"></span><h2>本轮审阅</h2></div><form id="feedback-form"><div class="review-fields"><div><label for="reviewer">审阅人</label><input id="reviewer" name="reviewer" maxlength="100" required autocomplete="name" placeholder="姓名或称呼"></div><div><label for="decision">整图结论</label><select id="decision" name="decision"><option value="changes_requested">需要修改</option><option value="approved">认可当前版本</option><option value="comment">仅补充意见</option></select></div></div><label for="feedback-note">说明 <span class="required">必填</span></label><textarea id="feedback-note" name="note" rows="3" maxlength="10000" required placeholder="写明认可范围，或需要返工的内容。"></textarea><p id="draft-hint" class="form-hint">逐区意见随本轮反馈一起保存。</p><div id="form-error" role="alert" hidden></div><button id="save-feedback" class="primary" type="submit">保存审阅</button></form></section>
<section class="revision-panel"><button id="copy-revision" type="button">复制返工指令</button><p id="revision-status" class="form-hint" role="status">使用当前版本最新已保存意见。</p><div id="revision-fallback" hidden><label for="revision-prompt">返工指令（可手动复制）</label><textarea id="revision-prompt" rows="5" readonly></textarea></div></section>
<section class="history-section"><div class="section-heading"><h2>审阅记录</h2><span id="history-count"></span></div><div id="history"></div></section></aside></div></div></main></div>
<dialog id="draft-dialog"><h2>当前意见尚未保存</h2><p>切换任务或刷新会丢弃本轮输入。</p><div class="dialog-actions"><button id="keep-editing">继续编辑</button><button id="discard-draft">丢弃并切换</button></div></dialog>
</body></html>
