[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "single-image-localizer"
version = "0.2.0"
description = "Agent-led, evidence-bound single image localization"
requires-python = ">=3.11"
dependencies = ["Pillow>=12.0,<13"]

[project.optional-dependencies]
font-subset = ["fonttools==4.60.1"]

[project.scripts]
image-localizer = "image_localizer.cli:main"

[tool.setuptools.package-data]
image_localizer = ["review_web/*.html", "review_web/*.css", "review_web/*.js", "review_web/*.ico"]

[tool.setuptools.packages.find]
where = ["src"]
